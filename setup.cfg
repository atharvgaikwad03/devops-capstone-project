[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service
cover-min-percentage=95

[coverage:report]
show_missing = True

[flake8]
max-line-length=100
exclude =
    .git,
    __pycache__,
    .eggs,
    *.egg

[pylint]
max-line-length=100
disable=
    C0114,
    C0116,
    W1203,
    W0212

[pycodestyle]
max-line-length=100
